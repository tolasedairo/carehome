{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - CareHome Management System</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Auth CSS -->
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth-body">
    <div class="container-fluid h-100">
        <div class="row h-100 g-0">
            <!-- Logout Confirmation -->
            <div class="col-lg-6 auth-right-side d-flex align-items-center justify-content-center p-4" style="margin-left: auto; margin-right: auto;">
                <div class="auth-form-container logout-container">
                    <!-- Icon -->
                    <div class="logout-icon mb-4" style="text-align: center;">
                        <div style="width: 100px; height: 100px; background: rgba(237, 137, 54, 0.15); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 48px; color: #ed8936; margin: 0 auto;">
                            <i class="fas fa-sign-out-alt"></i>
                        </div>
                    </div>

                    <!-- Content -->
                    <div class="logout-content text-center mb-4">
                        <h2 style="color: #2d7a7a; font-weight: 700; margin-bottom: 10px;">Confirm Logout</h2>
                        <p style="color: #666; font-size: 15px; margin: 0 0 20px 0;">
                            Are you sure you want to logout?
                        </p>
                        <p style="color: #999; font-size: 13px; line-height: 1.6;">
                            <i class="fas fa-info-circle me-2"></i>
                            You'll need to sign in again to access CareHome Management System and view resident information.
                        </p>
                    </div>

                    <!-- Logout Form -->
                    <form method="POST" class="mb-3">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-logout w-100" style="background: linear-gradient(135deg, #ed8936 0%, #dd7620 100%); border: none; color: white; font-weight: 600; padding: 12px 24px; border-radius: 10px; font-size: 15px; transition: all 0.3s ease; cursor: pointer; box-shadow: 0 4px 15px rgba(237, 137, 54, 0.2);">
                            <i class="fas fa-sign-out-alt me-2"></i>Yes, Logout
                        </button>
                    </form>

                    <!-- Cancel Button -->
                    <a href="{% url 'dashboard:home' %}" class="btn w-100" style="background: white; border: 2px solid #2d7a7a; color: #2d7a7a; font-weight: 600; padding: 12px 24px; border-radius: 10px; font-size: 15px; transition: all 0.3s ease; cursor: pointer; text-decoration: none; display: inline-block;">
                        <i class="fas fa-arrow-left me-2"></i>Stay Logged In
                    </a>

                    <!-- Footer Info -->
                    <div class="auth-footer mt-4">
                        <p class="text-muted text-center" style="font-size: 12px;">
                            <i class="fas fa-shield-alt me-1"></i>
                            Your data is safe and will remain secure
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .logout-container {
            max-width: 420px;
        }

        .btn-logout:hover {
            background: linear-gradient(135deg, #dd7620 0%, #c26a1a 100%) !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(237, 137, 54, 0.3) !important;
            color: white;
        }

        .btn-logout:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(237, 137, 54, 0.2) !important;
        }

        .btn:hover:not(.btn-logout) {
            background: #2d7a7a !important;
            color: white !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(45, 122, 122, 0.2) !important;
        }

        .logout-icon {
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .auth-form-container {
                padding: 25px;
            }
            
            h2 {
                font-size: 22px !important;
            }
        }
    </style>
</body>
</html>
