{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - CareHome Management System</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Auth CSS -->
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth-body">
    <div class="container-fluid h-100">
        <div class="row h-100 g-0">
            <!-- Logout Confirmation -->
            <div class="col-lg-6 auth-right-side d-flex align-items-center justify-content-center p-4 auth-right-center">
                <div class="auth-form-container logout-container">
                    <!-- Icon -->
                    <div class="logout-icon mb-4 text-center">
                        <div class="logout-icon-box">
                            <i class="fas fa-sign-out-alt"></i>
                        </div>
                    </div>

                    <!-- Content -->
                    <div class="logout-content text-center mb-4">
                        <h2 class="logout-title">Confirm Logout</h2>
                        <p class="logout-subtitle">
                            Are you sure you want to logout?
                        </p>
                        <p class="logout-note">
                            <i class="fas fa-info-circle me-2"></i>
                            You'll need to sign in again to access CareHome Management System and view resident information.
                        </p>
                    </div>

                    <!-- Logout Form -->
                    <form method="POST" class="mb-3">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-logout w-100">
                            <i class="fas fa-sign-out-alt me-2"></i>Yes, Logout
                        </button>
                    </form>

                    <!-- Cancel Button -->
                    <a href="{% url 'dashboard:home' %}" class="btn btn-ghost-teal w-100">
                        <i class="fas fa-arrow-left me-2"></i>Stay Logged In
                    </a>

                    <!-- Footer Info -->
                    <div class="auth-footer mt-4">
                        <p class="text-muted text-center logout-footer-text">
                            <i class="fas fa-shield-alt me-1"></i>
                            Your data is safe and will remain secure
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
