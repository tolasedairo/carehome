{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CareHome System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="d-flex">
    <!-- Sidebar -->
    <div class="bg-dark text-white p-3" style="width: 250px; min-height: 100vh;">
        <h4>CareHome</h4>
        <hr>
        <ul class="nav flex-column">

            <li class="nav-item"><a class="nav-link text-white" href="#">Residents</a></li>

            <li class="nav-item"><a class="nav-link text-white" href="#">Handovers</a></li>

            <li class="nav-item"><a class="nav-link text-danger" href="/accounts/logout/">Logout</a></li>
        </ul>
    </div>

    <!-- Main content -->
    <div class="flex-fill p-4">
        {% block content %}{% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
