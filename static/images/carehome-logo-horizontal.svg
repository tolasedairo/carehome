<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" role="img" aria-label="CareHome Management System">
  <!-- Icon background circle -->
  <circle cx="75" cy="75" r="70" fill="#2d7a7a"/>
  
  <!-- Shadow/depth circle -->
  <circle cx="75" cy="75" r="62" fill="#20c997" opacity="0.08"/>
  
  <!-- Heart shape (care symbol) -->
  <path d="M75 115C55 105 42 92 42 78c0-13 10-22 20-22 7 0 14 5 20 13 6-8 13-13 20-13 10 0 20 9 20 22 0 18-14 30-32 40l-10 7-10-7z" fill="#ffffff" filter="drop-shadow(0 1px 3px rgba(0,0,0,0.15))"/>
  
  <!-- Health chart line inside icon -->
  <path d="M35 90h32l10-20 18 36 11-22 6 6h32" fill="none" stroke="#f0ad4e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  
  <!-- Main text: CareHome -->
  <text x="170" y="95" font-family="Poppins, sans-serif" font-size="48" font-weight="700" fill="#2d7a7a" letter-spacing="-0.5">
    CareHome
  </text>
  
  <!-- Subtitle: Management System -->
  <text x="170" y="125" font-family="Poppins, sans-serif" font-size="16" fill="#666666" letter-spacing="0.5" font-weight="400">
    Management System
  </text>
</svg>
