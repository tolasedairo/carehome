<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="CareHome Management System">
  <!-- Main circle background -->
  <circle cx="150" cy="120" r="100" fill="#2d7a7a"/>
  
  <!-- Heart shape (care symbol) -->
  <path d="M150 180C128 165 110 151 110 132c0-16 12-26 24-26 9 0 18 6 24 15 6-9 15-15 24-15 12 0 24 10 24 26 0 19-15 33-36 48l-12 9-12-9z" fill="#ffffff"/>
  
  <!-- Health chart indicator (wavy line) -->
  <path d="M80 155h36l9-18 18 36 12-24 6 6h36" fill="none" stroke="#f0ad4e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  
  <!-- Text: CareHome -->
  <text x="150" y="260" font-family="Poppins, sans-serif" font-size="32" font-weight="600" text-anchor="middle" fill="#2d7a7a" letter-spacing="1">
    CareHome
  </text>
  
  <!-- Subtitle text -->
  <text x="150" y="285" font-family="Poppins, sans-serif" font-size="14" text-anchor="middle" fill="#666666" letter-spacing="0.5" font-weight="300">
    Management System
  </text>
