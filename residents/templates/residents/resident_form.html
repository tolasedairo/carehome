{% extends "base.html" %}

{% block page_title %}Add Resident{% endblock %}

{% block content %}

<div class="card shadow-sm border-0">
    <div class="card-body">

        <h4 class="mb-4">Add New Resident</h4>

        <form method="POST">
            {% csrf_token %}

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">First Name</label>
                    {{ form.first_name }}
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Last Name</label>
                    {{ form.last_name }}
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Room Number</label>
                    {{ form.room_number }}
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Gender</label>
                    {{ form.gender }}
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Date of Birth</label>
                    {{ form.date_of_birth }}
                </div>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'residents:list' %}" class="btn btn-secondary">
                    Cancel
                </a>

                <button type="submit" class="btn btn-primary">
                    Save Resident
                </button>
            </div>

        </form>

    </div>
</div>

{% endblock %}
